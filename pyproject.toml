[project]
name = "gralph"
version = "3.0.0"
description = """
Focused task runner for autonomous coding loops.
Drives AI agents through iterative cycles of coding and verification,
sandboxed via Docker for secure autonomy.
"""
dependencies = [
    "typer",
    "rich",
]
requires-python = ">=3.11"

[project.scripts]
gralph = "gralph.cli:app"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gralph*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
